#!/usr/bin/env sh

# Google Calendar + Tasks integration config
# Sourced by calendar and tasks scripts

confDir="${XDG_CONFIG_HOME:-$HOME/.config}"

# pipx binaries (gcalcli, nextmeeting)
export PATH="${HOME}/.local/bin:${PATH}"

# Google Calendar
GCAL_CALENDAR="your-email@gmail.com"
GCAL_DAYS_AHEAD=7
GCAL_NOTIFY_MINUTES=15

# Google Tasks
GTASKS_LIST_ID="your-list-id"
GTASKS_TOKEN_FILE="${HOME}/.gtasks/token.pickle"
GTASKS_API="https://tasks.googleapis.com/tasks/v1"

# Rofi
ROFI_THEME="${confDir}/rofi/calendar.rasi"
